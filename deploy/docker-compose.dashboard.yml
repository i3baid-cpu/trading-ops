# Trading Command Center on the VPS, next to FreqUI. Reached over Tailscale or an SSH tunnel only.
# Run from the repository root on the VPS:  docker compose -f deploy/docker-compose.dashboard.yml up -d --build
services:
  dashboard:
    build: ../dashboard
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
      - "100.99.81.45:8501:8501"
    environment:
      - DASH_MODE=live
      - FT_DB=/live/freqtrade/tradesv3.dryrun.sqlite
      - FT_CONFIG=/live/freqtrade/backtest_config.json
      - LUMIBOT_STATE=/live/lumibot/trend_filter_state.json
      - LUMIBOT_CONFIG=/live/lumibot/config.json
      - TZ=Asia/Kuwait
    volumes:
      # read only views of the live data; the dashboard can see, never change
      - /root/freqtrade/user_data/tradesv3.dryrun.sqlite:/live/freqtrade/tradesv3.dryrun.sqlite:ro
      - /root/freqtrade/user_data/backtest_config.json:/live/freqtrade/backtest_config.json:ro
      - /root/lumibot/strategies/trend_filter_state.json:/live/lumibot/trend_filter_state.json:ro
      - /root/lumibot/config.json:/live/lumibot/config.json:ro
      - ../dashboard/data:/app/data:ro
    read_only: true
    tmpfs:
      - /tmp
      - /root/.streamlit
