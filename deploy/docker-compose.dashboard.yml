# Trading Command Center on the VPS, next to FreqUI. Reached over Tailscale or an SSH tunnel only.
# Run from the repository root on the VPS:  docker compose -f deploy/docker-compose.dashboard.yml up -d --build
services:
  dashboard:
    build: ../dashboard
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
      - "100.99.81.45:8501:8501"
    environment:
      - DASH_MODE=live
      - FT_DB=/live/freqtrade/user_data/tradesv3.dryrun.sqlite
      - FT_CONFIG=/live/freqtrade/user_data/backtest_config.json
      - LUMIBOT_STATE=/live/lumibot/strategies/trend_filter_state.json
      - LUMIBOT_CONFIG=/live/lumibot/config.json
      - TZ=Asia/Kuwait
      - CRT_LOG=/app/crt_log/crt_log.csv
    volumes:
      # read only views of the live data; the dashboard can see, never change.
      # Directories, not single files: the sqlite is in WAL mode (recent trades sit in the -wal/-shm files next
      # to it, and a lone read-only file cannot be opened at all), and trend_filter.py replaces its state file
      # with os.replace, which a single-file bind mount would never see.
      - /root/freqtrade/user_data:/live/freqtrade/user_data:ro
      - /root/lumibot/strategies:/live/lumibot/strategies:ro
      - /root/lumibot/config.json:/live/lumibot/config.json:ro
      - ../dashboard/data:/app/data:ro
      # the only writable mount: the CRT signal log, kept in the repository's results folder
      - ../results/crt:/app/crt_log
    read_only: true
    tmpfs:
      - /tmp
      - /root/.streamlit
