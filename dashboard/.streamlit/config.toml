[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#15171c"
secondaryBackgroundColor = "#1c1f26"
textColor = "#e8e8e3"
font = "sans serif"

[server]
headless = true
port = 8501
address = "0.0.0.0"
fileWatcherType = "none"
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
